name: R17 publish today's Top-3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r17-publish-now.yml"

permissions:
  contents: write

concurrency:
  group: r17-one-shot-current-top3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate R17 source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/r15_intelligence.py scripts/r15_daily_auditor.py scripts/r15_free_mesh.py scripts/update_live.py
          python - <<'PY'
          import json
          c=json.load(open("config/analysis.json",encoding="utf-8"))
          assert c["bestBetsTarget"] == 3
          assert c["stakePerBestBetPercent"] == 10
          assert c["maximumDailyExposurePercent"] == 30
          assert c["premiumBetsPolicy"].startswith("STRICT_FILTERS_ONLY")
          print("R17_SOURCE=GREEN")
          PY
          python scripts/r15_intelligence.py --self-test

      - name: Generate current Top-3
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
          CLOUDFLARE_AI_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_AI_ACCESS_TOKEN }}
          CLOUDFLARE_AI_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          CLOUDFLARE_AI_URL: https://ai-football-free.shevtsov001.workers.dev/internal/ai
          R15_BOOTSTRAP_PREVIEW: "false"
          R15_RECOVERY_DAY: "false"
        run: |
          set -euo pipefail
          python scripts/r15_intelligence.py --settle
          python scripts/r15_intelligence.py --generate
          python scripts/r15_intelligence.py --validate
          python - <<'PY'
          import json
          s=json.load(open("data/state.json",encoding="utf-8"))
          best=s.get("bestBets") or []
          assert len(best) == 3, f"Top-3 expected, got {len(best)}"
          assert all(abs(float(x.get("stakePercent") or 0)-10.0)<0.001 for x in best)
          assert all(float(x.get("stake") or 0)>0 for x in best)
          assert len({str(x.get("eventId") or "") for x in best}) == 3
          premium=[x for x in (s.get("dailyAnalysis") or []) if x.get("premiumQualified")]
          print("R17_TOP3=3")
          print("R17_PREMIUM=",len(premium))
          print("R17_BANK=",s.get("bank",{}).get("current"))
          for i,x in enumerate(best,1):
              print("R17_PICK",i,x.get("homeRu") or x.get("home"),"—",x.get("awayRu") or x.get("away"),x.get("pickRu") or x.get("pick"),x.get("bookmakerOdds"),x.get("stake"))
          PY

      - name: Commit generated public state and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUBLIC_STATE_FILES=(
            data/state.json
            data/ai_daily_analysis.json
            data/last-update-report.json
            data/live-state.json
            data/live-learning.json
            data/football-history-cache.json
            data/team-registry.json
            data/free-data-mesh.json
            data/clubelo-ratings.json
            data/russian-team-names.json
            data/fonbet-public-snapshot.json
            data/thesportsdb-team-cache.json
            data/r15-odds-cache.json
            data/football-data-fixtures-odds.json
            data/provider-health.json
            data/r15-runtime-control.json
            data/cloudflare-ai-daily-audit.json
          )
          for path in "${PUBLIC_STATE_FILES[@]}"; do
            if [[ -e "$path" ]] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done
          git rm -f .github/workflows/r17-publish-now.yml
          git commit -m "R17 publish current mandatory Top-3 [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main --prune
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "R17_CURRENT_TOP3_PUSH=GREEN"
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1
