name: R16 final one-bank acceptance

on:
  push:
    branches: [r16-one-bank-final-cleanup-20261007]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and one-bank policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/r15_intelligence.py scripts/r15_daily_auditor.py scripts/r15_free_mesh.py scripts/update_live.py
          node --check assets/app.js
          node --check sw.js
          python - <<'PY'
          import json
          c=json.load(open("config/analysis.json",encoding="utf-8"))
          s=json.load(open("data/state.json",encoding="utf-8"))
          snap=json.load(open("data/ai_daily_analysis.json",encoding="utf-8"))
          assert c["bestBetsTarget"] == 3
          assert c["stakePerBestBetPercent"] == 10
          assert c["maximumDailyExposurePercent"] == 30
          assert c["minimumBookmakerOdds"] >= 1.55
          assert c["expressStakePercent"] == 0
          assert s["meta"]["bestBetsTarget"] == 3
          assert s["meta"]["stakePerPredictionPercent"] == 10
          assert s["meta"]["maximumDailyExposurePercent"] == 30
          assert s["bank"]["current"] == 6971.08
          assert s["bank"]["stakePercent"] == 10
          assert s["bank"]["mode"] == "ACTIVE_SINGLE_BANK"
          assert s["expressBank"]["current"] == 7000
          assert s["expressBank"]["mode"] == "LEGACY_ARCHIVE_ONLY"
          assert s["expressBank"]["financialWritesDisabled"] is True
          assert "bank" in snap and "expressBank" not in snap
          assert snap["bank"]["current"] == 6971.08
          print("R16_ONE_BANK_POLICY=GREEN")
          PY
      - name: Backend regression
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_predictions.py --self-test
          python scripts/r15_free_mesh.py --self-test
          python scripts/r15_daily_auditor.py --self-test
          python scripts/r15_intelligence.py --self-test
          python scripts/update_live.py --self-test
          python scripts/update_predictions.py --validate
          python scripts/r15_intelligence.py --validate
      - name: UI and build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          html=pathlib.Path("index.html").read_text(encoding="utf-8")
          app=pathlib.Path("assets/app.js").read_text(encoding="utf-8")
          for value in ("Единый виртуальный банк","3 × 10%"):
              assert value in html
          for value in ("bankSnapshot","renderBankChart","state.bank"):
              assert value in app
          assert "Банк <strong>не используется</strong>" in app
          print("R16_ONE_BANK_UI=GREEN")
          PY
          bash scripts/cloudflare_pages_build.sh
          test -f dist/index.html
          test -f dist/assets/app.js
