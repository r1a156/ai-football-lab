# V10_R15F_FREE_DATA_MESH_MATCH_INTELLIGENCE_EXPRESS_PORTFOLIO
# V10_R6_LIVE_AUTO_REFRESH — compatibility marker for existing live validator
name: R15F live scores and express settlement

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: v10-production-state-writer
  cancel-in-progress: false

jobs:
  settle-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Track only current fifteen and settle expresses
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/r15_free_mesh.py scripts/r15_intelligence.py scripts/update_live.py
          python scripts/update_live.py --update
          python scripts/r15_intelligence.py --settle
          python scripts/r15_intelligence.py --validate
          python scripts/update_live.py --validate

      - name: Commit score and result changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/state.json \
            data/ai_daily_analysis.json \
            data/last-update-report.json \
            data/live-state.json \
            data/live-learning.json \
            data/football-history-cache.json \
            data/team-registry.json \
            data/provider-health.json
          if git diff --cached --quiet; then
            echo "R15F_NO_LIVE_CHANGES=YES"
            exit 0
          fi
          git commit -m "R15F settle live scores and express tickets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
