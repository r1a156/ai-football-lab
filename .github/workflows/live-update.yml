# V10_R6_LIVE_AUTO_REFRESH
# V10_R7_HISTORY_LIVE_CLEANUP
# V10_R8_ATOMIC_BATCH_ROLLOVER
# V10_R9_IMMEDIATE_SETTLEMENT_ROLLOVER
# V10_R10_ATOMIC_BEST_FOUR_SYNC
# V10_R12_FINAL_MAX_HIT_RATE_15_SETTLEMENT
# V10_R14_RESULT_INTEGRITY_GOAL_DIRECTION
# V10_R14R1_LEGACY_RUSSIAN_SETTLEMENT_BRIDGE
# V10_R14R2_MOSCOW_08_WATCHDOG
# V10_R14_FOOTBALL_ONLY_STANDARD_MARKETS
# ALL_FIFTEEN_SETTLEMENT_VISIBLE
name: V10 R14R2 Живой цикл — результаты, утренний watchdog и rollover

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_live.py"
      - "scripts/update_predictions.py"
      - "config/analysis.json"
      - ".github/workflows/live-update.yml"

permissions:
  contents: write

concurrency:
  group: v10-production-state-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  live:
    name: Завершить все 15 и опубликовать следующую футбольную подборку
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить код и выполнить только необходимый ремонт
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/update_live.py
          python -m json.tool config/analysis.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/live-state.json > /dev/null
          python -m json.tool data/live-learning.json > /dev/null
          node --check assets/app.js

          repair_required="$(python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('data/state.json').read_text(encoding='utf-8-sig'))
          config = json.loads(Path('config/analysis.json').read_text(encoding='utf-8-sig'))
          meta = state.get('meta') or {}
          expected = float(config.get('stakePerBestBetPercent', 20))
          best = state.get('bestBets') or []
          broken_stake = any(
              abs(float(item.get('stakePercent') or 0) - expected) > 0.001
              or float(item.get('stake') or 0) <= 0
              for item in best
          )
          print('YES' if meta.get('integrityPatch') != 'V10_R14_RESULT_INTEGRITY_GOAL_DIRECTION' or broken_stake else 'NO')
          PY
          )"
          echo "R14_REPAIR_REQUIRED=${repair_required}"
          if [ "${repair_required}" = "YES" ]; then
            python scripts/update_predictions.py --repair-integrity
          fi
          python scripts/update_predictions.py --validate
          python scripts/update_live.py --validate

      - name: Обновить живые матчи
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/update_live.py --update

      - name: Завершить текущую подборку и при готовности создать следующую
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          python scripts/update_predictions.py --live-cycle
          echo "R14R2_LIVE_CYCLE_COMPLETED=YES"

      - name: Финальная проверка R14
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/update_live.py
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/live-state.json > /dev/null
          python -m json.tool data/live-learning.json > /dev/null
          python scripts/update_live.py --validate
          if ! python scripts/update_predictions.py --validate; then
            echo "R14_POST_UPDATE_REPAIR=START"
            python scripts/update_predictions.py --repair-integrity
            python scripts/update_predictions.py --validate
          fi
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('predictions', Path('scripts/update_predictions.py'))
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          state = json.loads(Path('data/state.json').read_text(encoding='utf-8-sig'))
          config = json.loads(Path('config/analysis.json').read_text(encoding='utf-8-sig'))
          daily = state.get('dailyAnalysis') or []
          best = state.get('bestBets') or []
          bank = state.get('bank') or {}
          target15 = int(config['dailyAnalysisTarget'])
          target4 = int(config['bestBetsTarget'])
          if daily and len(daily) != target15:
              raise SystemExit(f'Published batch is not exact fifteen: {len(daily)}')
          if daily and len(best) != target4:
              raise SystemExit(f'Published best list is not exact four: {len(best)}')
          daily_ids = [str(item.get('eventId') or '') for item in daily]
          best_ids = [str(item.get('eventId') or '') for item in best]
          if any(not value for value in daily_ids + best_ids):
              raise SystemExit('Prediction without eventId')
          if len(daily_ids) != len(set(daily_ids)) or len(best_ids) != len(set(best_ids)):
              raise SystemExit('Duplicate match in current publication')
          if not set(best_ids).issubset(set(daily_ids)):
              raise SystemExit('Best four is outside the fifteen')
          expected_percent = float(config['stakePerBestBetPercent'])
          for item in best:
              if abs(float(item.get('stakePercent') or 0) - expected_percent) > 0.001:
                  raise SystemExit('Twenty-percent bank policy changed')
          legacy_russian_event_ids = set()
          for item in daily + best:
              is_r14_record = item.get('marketPolicy') == module.R14_MARKET_POLICY
              is_russian_domestic = module.competition_is_excluded(
                  item.get('sportKey'), item.get('league'), '', item.get('country'), config
              )
              if is_r14_record:
                  if not module.record_uses_r14_standard_market(item):
                      raise SystemExit('Forbidden Asian/nonstandard market in R14 publication')
                  if item.get('sport') != 'soccer':
                      raise SystemExit('Non-football event in R14 publication')
                  if is_russian_domestic:
                      raise SystemExit('Russian domestic event in newly generated R14 publication')
              elif is_russian_domestic:
                  legacy_russian_event_ids.add(str(item.get('eventId') or item.get('id') or 'UNKNOWN'))
          print('R14R1_LEGACY_RUSSIAN_EVENTS_ALLOWED_FOR_SETTLEMENT=', len(legacy_russian_event_ids))
          if any(bool(item.get('goalDirectionConflict')) for item in best):
              raise SystemExit('Unsupported total direction in R14 best four')
          if sum(1 for item in best if str(item.get('market') or '').upper() == 'TOTAL_UNDER') > int(config.get('maximumTotalUnderBestBets', 1)):
              raise SystemExit('Too many total-under bets in R14 best four')
          terminal = {'won', 'lost', 'push', 'void', 'cancelled'}
          for item in daily:
              status = str(item.get('status') or 'pending')
              if status in terminal and status not in {'void', 'cancelled'} and not str(item.get('score') or '').strip():
                  raise SystemExit('Settled analysis has no visible score')
          expected_placed = sum(float(item.get('stake') or 0) for item in best if str(item.get('status') or 'pending') == 'pending')
          if abs(float(bank.get('placedAmount') or 0) - expected_placed) > 0.02:
              raise SystemExit('Placed bank amount mismatch')
          print('R14_LIVE_ACCEPTANCE=GREEN')
          print('EXACT_DAILY_ANALYSIS=', len(daily))
          print('EXACT_BEST_BETS=', len(best))
          print('FOOTBALL_ONLY=YES')
          print('ASIAN_MARKETS=REMOVED')
          print('BANK_CURRENT=', bank.get('current'))
          PY

      - name: Сохранить только реальные изменения данных
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-state.json data/live-learning.json data/state.json data/last-update-report.json data/ai_daily_analysis.json
          if git diff --cached --quiet; then
            echo "R14_NO_DATA_CHANGES=YES"
            exit 0
          fi
          git commit -m "V10 R14 settle football 15 and publish standard-market batch [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
