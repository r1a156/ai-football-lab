# V10_R15F_R3_FINAL_COGNITIVE_PORTFOLIO
# V10_R6_LIVE_AUTO_REFRESH — compatibility marker for existing live validator
name: R15F live scores and express settlement

on:
  workflow_dispatch:
  schedule:
    # Keep 05:00-06:59 UTC clear for the dedicated morning writer.
    # Outside that window this also acts as a missing-portfolio watchdog.
    - cron: '3,13,23,33,43,53 0-4,7-23 * * *'

permissions:
  contents: write

concurrency:
  group: v10-production-state-writer
  cancel-in-progress: false

jobs:
  settle-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Settle current state and recover a missing Moscow-day portfolio
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
          R15_RECOVERY_DAY: "true"
          CLOUDFLARE_AI_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_AI_ACCESS_TOKEN }}
          CLOUDFLARE_AI_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          CLOUDFLARE_AI_URL: https://ai-football-free.shevtsov001.workers.dev/internal/ai
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/r15_free_mesh.py scripts/r15_intelligence.py scripts/r15_daily_auditor.py scripts/update_live.py
          python scripts/update_live.py --update
          python scripts/r15_intelligence.py --settle
          python scripts/r15_intelligence.py --generate
          python scripts/r15_intelligence.py --validate
          python scripts/update_live.py --validate

      - name: Commit score, result, or watchdog portfolio changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WATCHDOG_STATE_FILES=(
            data/state.json
            data/ai_daily_analysis.json
            data/last-update-report.json
            data/live-state.json
            data/live-learning.json
            data/football-history-cache.json
            data/team-registry.json
            data/free-data-mesh.json
            data/clubelo-ratings.json
            data/russian-team-names.json
            data/fonbet-public-snapshot.json
            data/thesportsdb-team-cache.json
            data/r15-odds-cache.json
            data/football-data-fixtures-odds.json
            data/provider-health.json
            data/r15-runtime-control.json
            data/cloudflare-ai-daily-audit.json
          )
          for path in "${WATCHDOG_STATE_FILES[@]}"; do
            if [[ -e "$path" ]] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "R15F_NO_LIVE_CHANGES=YES"
            exit 0
          fi
          git commit -m "R15F settle live scores and express tickets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
