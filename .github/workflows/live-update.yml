# V10_R6_LIVE_AUTO_REFRESH
# V10_R7_HISTORY_LIVE_CLEANUP
# V10_R8_ATOMIC_BATCH_ROLLOVER
# V10_R9_IMMEDIATE_SETTLEMENT_ROLLOVER
# V10_R10_ATOMIC_BEST_FOUR_SYNC
# V10_R12_FINAL_MAX_HIT_RATE_15_SETTLEMENT
name: V10 R12 Живой цикл, точные 15 + 4 и результаты всех прогнозов

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_live.py"
      - "scripts/update_predictions.py"
      - "config/analysis.json"
      - ".github/workflows/live-update.yml"

permissions:
  contents: write

concurrency:
  group: v10-production-state-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  live:
    name: Счёт всех 15, обучение и следующая точная подборка
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить исходный код текущих матчей
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/update_live.py
          python -m json.tool config/analysis.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/live-state.json > /dev/null
          python -m json.tool data/live-learning.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/last-update-report.json > /dev/null
          node --check assets/app.js
          python scripts/update_predictions.py --repair-integrity
          python scripts/update_predictions.py --validate
          python scripts/update_live.py --validate

      - name: Обновить отслеживаемые матчи
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/update_live.py --update

      - name: Рассчитать текущую подборку и сразу сформировать следующую
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          python scripts/update_predictions.py --live-cycle

      - name: Проверить обновлённые данные
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/live-state.json > /dev/null
          python -m json.tool data/live-learning.json > /dev/null
          python scripts/update_live.py --validate
          python - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(Path("data/live-state.json").read_text(encoding="utf-8"))
          learning = json.loads(Path("data/live-learning.json").read_text(encoding="utf-8"))
          state = json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          config = json.loads(Path("config/analysis.json").read_text(encoding="utf-8"))
          bank = state.get("bank") or {}
          batch = state.get("batch") or {}
          meta = state.get("meta") or {}
          daily = state.get("dailyAnalysis") or []
          best = state.get("bestBets") or []

          if live.get("sourceMarker") != "V10_R6_LIVE_MATCH_INTELLIGENCE":
              raise SystemExit("Live state marker mismatch")
          if learning.get("sourceMarker") != "V10_R6_LIVE_MATCH_INTELLIGENCE":
              raise SystemExit("Live learning marker mismatch")
          for event in live.get("events") or []:
              if not event.get("eventId"):
                  raise SystemExit("Live event without eventId")
              if not event.get("originalPredictionImmutable"):
                  raise SystemExit("Live event lost original-prediction immutability guard")
              if event.get("status") in {"FINISHED", "CANCELLED", "POSTPONED", "UNCONFIRMED"}:
                  raise SystemExit("Non-current event leaked into public live list")

          target15 = int(config["dailyAnalysisTarget"])
          target4 = int(config["bestBetsTarget"])
          if daily and len(daily) != target15:
              raise SystemExit(f"Published batch is not exact fifteen: {len(daily)}")
          if daily and len(best) != target4:
              raise SystemExit(f"Published best list is not exact four: {len(best)}")
          daily_events = [str(item.get("eventId") or "") for item in daily]
          best_events = [str(item.get("eventId") or "") for item in best]
          if any(not value for value in daily_events + best_events):
              raise SystemExit("Prediction without eventId")
          if len(daily_events) != len(set(daily_events)):
              raise SystemExit("The fifteen contains duplicate matches")
          if len(best_events) != len(set(best_events)):
              raise SystemExit("The best four contains duplicate matches")
          if not set(best_events).issubset(set(daily_events)):
              raise SystemExit("The best four is outside the current fifteen")

          terminal = {"won", "lost", "push", "void", "cancelled"}
          for item in daily:
              status = str(item.get("status") or "pending")
              if status in terminal and not str(item.get("score") or "").strip() and status not in {"void", "cancelled"}:
                  raise SystemExit("A settled analysis is missing its visible final score")
          if meta.get("bestBetsSynchronizationPolicy") != "IMMUTABLE_AFTER_PUBLICATION_UNTIL_SETTLEMENT":
              raise SystemExit("Frozen best-four policy marker is missing")

          expected_placed = sum(
              float(item.get("stake") or 0)
              for item in best
              if str(item.get("status") or "pending") == "pending"
          )
          if abs(float(bank.get("placedAmount") or 0) - expected_placed) > 0.02:
              raise SystemExit("Placed bank amount is not linked to pending best bets")
          expected_available = max(0.0, float(bank.get("current") or 0) - expected_placed)
          if abs(float(bank.get("available") or 0) - expected_available) > 0.02:
              raise SystemExit("Available bank is not linked to current and placed amounts")
          if daily and not batch.get("id"):
              raise SystemExit("Current batch metadata is missing")
          if batch.get("completed"):
              raise SystemExit("Completed batch was not rolled over in the same live cycle")

          print("LIVE_STATE_ACCEPTANCE=GREEN")
          print("EXACT_DAILY_ANALYSIS=", len(daily))
          print("EXACT_BEST_BETS=", len(best))
          print("DAILY_TERMINAL_VISIBLE=", sum(1 for item in daily if str(item.get("status")) in terminal))
          print("BANK_CURRENT=", bank.get("current"))
          print("BANK_PLACED=", bank.get("placedAmount"))
          print("BANK_AVAILABLE=", bank.get("available"))
          PY

      - name: V10 R12 финальная проверка точных 15 + 4 и результатов
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/update_live.py
          python -m json.tool config/analysis.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/live-state.json > /dev/null
          python -m json.tool data/live-learning.json > /dev/null
          python scripts/update_predictions.py --repair-integrity
          python scripts/update_predictions.py --validate

      - name: Сохранить изменившиеся данные
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-state.json data/live-learning.json data/state.json data/last-update-report.json data/ai_daily_analysis.json
          if git diff --cached --quiet; then
            echo "No live data changes to commit."
            exit 0
          fi
          git commit -m "V10 R12 settle all fifteen, learn and publish exact 15 plus 4 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
