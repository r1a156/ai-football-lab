name: Daily AI Football Analysis

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  ai-analysis:

    name: Daily OpenRouter AI Analysis

    runs-on: ubuntu-latest

    timeout-minutes: 20


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Check secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY missing"
            exit 1
          fi


      - name: Run daily AI analysis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemini-2.5-flash-lite
        run: |
          python scripts/update_predictions.py --daily-ai


      - name: Save AI result

        run: |

          git config user.name "AI Football Lab Bot"

          git config user.email "actions@users.noreply.github.com"


          git add data/ai_daily_analysis.json


          git diff --cached --quiet || git commit -m "Daily AI football analysis"


          git push origin main
