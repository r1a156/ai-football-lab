name: R17 top3 premium acceptance

on:
  push:
    branches: [r17-top3-always-premium-separate-ru-20261007]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/r15_intelligence.py scripts/r15_daily_auditor.py scripts/r15_free_mesh.py scripts/update_live.py
          node --check assets/app.js
          node --check sw.js
          python - <<'PY'
          import json, pathlib
          c=json.load(open("config/analysis.json",encoding="utf-8"))
          assert c["bestBetsTarget"] == 3
          assert c["stakePerBestBetPercent"] == 10
          assert c["maximumDailyExposurePercent"] == 30
          assert c["premiumBetsMaximum"] == 3
          assert c["premiumBetsPolicy"].startswith("STRICT_FILTERS_ONLY")
          assert c["topThreeSelectionPolicy"].startswith("ALWAYS_SELECT_THREE")
          html=pathlib.Path("index.html").read_text(encoding="utf-8")
          app=pathlib.Path("assets/app.js").read_text(encoding="utf-8")
          assert "Премиум‑ставки" in html
          assert "Топ‑3" in html and "3 × 10%" in html
          assert 'id="premiumGrid"' in html and 'id="summaryPremium"' in html
          assert "renderPremium" in app
          for forbidden in ("Live intelligence","AUTO GUARD","hit rate","Max drawdown",">ROI<",">Brier<"):
              assert forbidden not in html, forbidden
          print("R17_POLICY_UI=GREEN")
          PY
      - name: Backend self tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_predictions.py --self-test
          python scripts/r15_free_mesh.py --self-test
          python scripts/r15_daily_auditor.py --self-test
          python scripts/r15_intelligence.py --self-test
          python scripts/update_live.py --self-test
          python scripts/update_predictions.py --validate
          python scripts/r15_intelligence.py --validate
      - name: Static build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cloudflare_pages_build.sh
          test -f dist/index.html
          test -f dist/assets/app.js
          grep -q 'Премиум‑ставки' dist/index.html
          grep -q '3 × 10%' dist/index.html
