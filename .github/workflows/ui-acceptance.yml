name: UI premium acceptance

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "scripts/cloudflare_pages_build.sh"
      - ".github/workflows/ui-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-premium-acceptance
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check sw.js

      - name: Validate premium DOM and PWA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          html = (root/"index.html").read_text(encoding="utf-8")
          app = (root/"assets/app.js").read_text(encoding="utf-8")
          css = (root/"assets/styles.css").read_text(encoding="utf-8")
          manifest = json.loads((root/"manifest.webmanifest").read_text(encoding="utf-8"))

          required_ids = {
              "spotlightTeams","spotlightPick","spotlightProbability","spotlightQuality",
              "spotlightStability","spotlightOdds","spotlightEv","spotlightBankroll",
              "spotlightReasons","checkedCount","qualifiedCount","publishedCount",
              "topRejectionReason","healthOverall","healthGrid","stat7Hit","stat7Brier",
              "stat30Hit","stat30Brier","guardStatus","bankrollGuard","installApp",
              "matchList","expressGrid","singleGrid","premiumGrid","summaryPremium","historyList",
              "bankCurrent","bankProfit","bankRoi","bankDrawdown","bankChart","bankHistoryCount"
          }
          present = set(re.findall(r'id="([^"]+)"', html))
          missing = sorted(required_ids - present)
          assert not missing, f"Missing premium DOM ids: {missing}"

          assert "V17_TOP3_ALWAYS_PREMIUM_SEPARATE_RUSSIAN" in html
          assert "17.0.0-top3-premium-ru" in html
          assert "V16_5_SINGLE_BANK_TOP3_GRAPH" in html
          assert "renderSpotlight" in app
          assert "renderPremium" in app
          assert "renderModelStats" in app
          assert "setupPwa" in app
          assert "intelligence" in css and "model-grid" in css and "signal-cluster" in css
          assert "V16.2 grid + bank repair" in css
          assert "match-side" in app and "bankSnapshot" in app and "renderBankChart" in app
          assert manifest["display"] == "standalone"
          assert manifest["start_url"] == "./"
          assert (root/"assets/app-icon.svg").is_file()
          assert (root/"sw.js").is_file()
          print("PREMIUM_DOM=GREEN")
          print("PWA=GREEN")
          PY

      - name: Validate live data schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          state=json.loads(pathlib.Path("data/state.json").read_text(encoding="utf-8"))
          assert isinstance(state.get("meta"), dict)
          assert isinstance(state.get("dailyAnalysis"), list)
          assert isinstance(state.get("analysisHistory"), list)
          assert isinstance(state.get("expresses"), list)
          for row in state.get("dailyAnalysis") or []:
              assert row.get("commenceTime")
              assert row.get("dataQuality") is not None
              assert row.get("conservativeProbability") is not None
          print("STATE_SCHEMA=GREEN")
          print("CURRENT_ANALYSIS=", len(state.get("dailyAnalysis") or []))
          PY

      - name: Static build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cloudflare_pages_build.sh
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/assets/styles.css
          test -f dist/data/state.json
          echo "STATIC_BUILD=GREEN"

      - name: Browser render smoke
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo "No Chromium browser on runner"; exit 2; }
          python3 -m http.server 4173 --directory . >/tmp/ai-football-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          "$BROWSER" --headless=new --no-sandbox --disable-gpu             --virtual-time-budget=8000             --window-size=1440,1800             --dump-dom http://127.0.0.1:4173/ > /tmp/desktop-dom.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu             --virtual-time-budget=8000             --window-size=390,1600             --dump-dom http://127.0.0.1:4173/ > /tmp/mobile-dom.html

          grep -q 'Премиум‑ставки' /tmp/desktop-dom.html
          grep -q 'Топ‑3' /tmp/desktop-dom.html
          grep -q '3 × 10%' /tmp/desktop-dom.html
          grep -q 'Единый виртуальный банк' /tmp/desktop-dom.html
          grep -q 'Экспресс' /tmp/desktop-dom.html
          grep -q 'bankChart' /tmp/desktop-dom.html
          grep -q 'signal-cluster' /tmp/desktop-dom.html
          grep -q 'mobile-nav' /tmp/mobile-dom.html
          ! grep -q 'Загружаем подборку' /tmp/desktop-dom.html
          ! grep -q 'Live intelligence' /tmp/desktop-dom.html
          ! grep -q 'AUTO GUARD' /tmp/desktop-dom.html
          ! grep -q 'Max drawdown' /tmp/desktop-dom.html
          echo "BROWSER_RENDER_DESKTOP=GREEN"
          echo "BROWSER_RENDER_MOBILE=GREEN"
