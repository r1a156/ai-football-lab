name: Full Moscow Day Board Regression

on:
  push:
    branches: [main]
    paths:
      - "scripts/r15_intelligence.py"
      - "scripts/update_predictions.py"
      - "assets/app.js"
      - ".github/workflows/full-day-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production source and browser
        run: |
          python -m py_compile scripts/r15_intelligence.py scripts/update_predictions.py scripts/r15_free_mesh.py scripts/r15_daily_auditor.py scripts/update_live.py
          node --check assets/app.js
      - name: Full-day, duplicate-fixture and market-guard regression
        run: |
          python scripts/r15_intelligence.py --self-test
      - name: Bank-ledger idempotency regression
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import update_predictions as core; core.self_test_bank_settlement_idempotency(); print('BANK_LEDGER_IDEMPOTENCY=GREEN')"
      - name: No unsafe live-state modifications
        run: |
          git diff --exit-code -- data/state.json data/ai_daily_analysis.json
