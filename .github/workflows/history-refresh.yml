# V10_R15F_NO_KEY_FREE_DATA_MESH
name: R15F no-key football history mesh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
      timezone: 'Europe/Moscow'

permissions:
  contents: write

concurrency:
  group: v10-production-state-writer
  cancel-in-progress: false

jobs:
  refresh-free-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh no-key public football sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py scripts/r15_free_mesh.py scripts/r15_intelligence.py
          python scripts/r15_free_mesh.py --self-test
          python scripts/r15_free_mesh.py --refresh
          python scripts/r15_intelligence.py --history-refresh
          python -m json.tool data/football-history-cache.json >/dev/null
          python -m json.tool data/team-registry.json >/dev/null
          python -m json.tool data/free-data-mesh.json >/dev/null
          python -m json.tool data/clubelo-ratings.json >/dev/null
          python -m json.tool data/russian-team-names.json >/dev/null
          python -m json.tool data/provider-health.json >/dev/null

      - name: Commit only persistent data mesh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/football-history-cache.json \
            data/team-registry.json \
            data/free-data-mesh.json \
            data/clubelo-ratings.json \
            data/russian-team-names.json \
            data/fonbet-public-snapshot.json \
            data/provider-health.json
          if git diff --cached --quiet; then
            echo "R15F_FREE_MESH_ALREADY_CURRENT=YES"
            exit 0
          fi
          git commit -m "R15F refresh no-key football data mesh [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
