name: Обновление футбольной аналитики

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */2 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/update_predictions.py"
      - "config/analysis.json"

permissions:
  contents: write

concurrency:
  group: football-analysis-update
  cancel-in-progress: false

jobs:
  update:
    name: Получение и анализ матчей
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка секретов
        shell: bash
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${FOOTBALL_DATA_API_KEY}" ]; then
            echo "::error::Не задан секрет FOOTBALL_DATA_API_KEY"
            exit 1
          fi

          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::Не задан секрет OPENROUTER_API_KEY"
            exit 1
          fi

          echo "Обязательные секреты присутствуют."

      - name: Проверка исходных файлов
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile scripts/update_predictions.py

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("config/analysis.json"),
              Path("data/state.json"),
          ]

          for path in files:
              raw = path.read_bytes()

              if raw.startswith(b"\xef\xbb\xbf"):
                  raise SystemExit(
                      f"{path}: обнаружен запрещённый UTF-8 BOM"
                  )

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as source:
                  json.load(source)

              print(f"{path}: корректный UTF-8 без BOM")
          PY

      - name: Обновление данных
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          python scripts/update_predictions.py

      - name: Проверка результата
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def read_json(path_value):
              path = Path(path_value)

              with path.open(
                  "r",
                  encoding="utf-8-sig",
              ) as source:
                  return json.load(source)

          state = read_json("data/state.json")
          report = read_json(
              "data/last-update-report.json"
          )

          mode = state.get("meta", {}).get("mode")
          status = report.get("status")
          predictions = state.get("predictions", [])
          history = state.get("history", [])

          if mode != "real":
              raise SystemExit(
                  "state.json не переведён в реальный режим"
              )

          if status == "FAILED":
              raise SystemExit(
                  "Pipeline сформировал FAILED-отчёт: "
                  + str(report.get("message", "без сообщения"))
              )

          print("Режим:", mode)
          print(
              "Статус анализа:",
              state.get("meta", {}).get("analysisStatus")
          )
          print("Прогнозов:", len(predictions))
          print("История:", len(history))
          print("Отчёт:", status)
          PY

      - name: Нормализация выходных JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          for value in (
              "data/state.json",
              "data/last-update-report.json",
          ):
              path = Path(value)
              text = path.read_text(encoding="utf-8-sig")
              path.write_text(
                  text,
                  encoding="utf-8",
                  newline="\n",
              )
              print(f"Нормализован: {path}")
          PY

      - name: Сохранение обновлённых данных
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- \
            data/state.json \
            data/last-update-report.json; then
            echo "Данные не изменились. Коммит не требуется."
            exit 0
          fi

          git config user.name "AI Football Lab Bot"
          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            data/state.json \
            data/last-update-report.json

          git commit \
            -m "Автоматическое обновление футбольной аналитики"

          git push origin main