# R3R23_PER_KEY_QUOTA_LEDGER_2026_10_07
# R3R22_ROLLING_72H_BREADTH_FIRST_2026_10_06
# R3R21B_FORM_CONFIG_WIRING_2026_10_06
# R3R21_ADAPTIVE_FORM_DECAY_2026_10_06
# R3R20_CORE_QUALIFICATION_AND_ODDS_FLOOR_2026_10_06
# R3R19_FINAL_CALIBRATED_ACCEPTANCE_2026_10_06
# R3R18_DIVERSIFICATION_SELFTEST_TRIGGER_2026_10_06
# R3R17_CALIBRATION_GUARD_TRIGGER_2026_10_06
# R3R16_FINAL_SAFE_TUNING_TRIGGER_2026_10_06
# R3R15_RECOVERY_SETTLEMENT_FIX_2026_10_06
# R3R13_BACKUP_RECOVERY_TRIGGER_2026_10_06
# R3R14_SAFE_RECOVERY_RETRY_2026_10_06
# R3R14_SAFE_RECOVERY_TRIGGER_2026_10_06
# R3R13_PARTIAL_RECOVERY_TRIGGER_2026_10_06
# R3R13_STRICT_DAY_ROLLOVER_TRIGGER_2026_10_06
# RECOVERY_TRIGGER_2026_10_05_CURRENT_HISTORY
# V10_R15F_R3_FINAL_COGNITIVE_PORTFOLIO
# V10_R15F_R3R8_SOURCE_INTEGRITY_GENERATION_GUARD
# V10_R15F_R3R12_NO_KEY_FIXTURE_ODDS_FALLBACK
# CURRENT_TEAM_HISTORY_RECOVERY_R1
# CURRENT_TEAM_HISTORY_RECOVERY_R2
# ONE_DAY_RECOVERY_2026_10_05
# ONE_DAY_RECOVERY_RETRY_1
name: R15F R3 cognitive morning portfolio

on:
  # A reviewed change to the production engine must rebuild public state
  # immediately; data-only bot commits do not match these paths.
  push:
    branches: [main]
    paths:
      - "scripts/r15_intelligence.py"
      - "scripts/r15_free_mesh.py"
      - "scripts/r15_rollover_gate.py"
      - ".github/workflows/live-update.yml"
      - "scripts/update_predictions.py"
      - "config/analysis.json"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:
    inputs:
      bootstrap_preview:
        description: 'Publish one temporary full preview before the first normal 08:00 MSK window'
        required: false
        default: false
        type: boolean
      recovery_today:
        description: 'Publish one-day HYBRID recovery portfolio when strict 15 is unavailable'
        required: false
        default: false
        type: boolean
  schedule:
    # Moscow is UTC+03 year-round: these are 08:07, 08:22, 08:37 and 09:02 MSK.
    - cron: '7 5 * * *'
    - cron: '22 5 * * *'
    - cron: '37 5 * * *'
    - cron: '2 6 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: v10-production-state-writer
  cancel-in-progress: false

jobs:
  publish-r15f-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize newest main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git checkout -B main origin/main
          echo "R3R8_SOURCE_HEAD=$(git rev-parse HEAD)"
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and validate source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "V10_R15F_R3R13_STRICT_24H_ROLLOVER_AND_PARTIAL_AVAILABILITY" scripts/r15_intelligence.py
          python -c "import json,pathlib; c=json.loads(pathlib.Path('config/analysis.json').read_text(encoding='utf-8')); assert int(c.get('portfolioSearchHorizonHours',0)) == 72; assert int(c.get('operationalWindowSearchDays',0)) == 3; assert float(c.get('minimumBookmakerOdds',0)) >= 1.55; assert int(c.get('dailyAnalysisTarget',0)) == 15; assert int(c.get('bestBetsTarget',0)) == 3; assert float(c.get('stakePerBestBetPercent',0)) == 10; assert float(c.get('maximumDailyExposurePercent',0)) == 30; assert float(c.get('expressStakePercent',-1)) == 0; assert float(c.get('formSparseHalfLifeDays',0)) >= 180; assert not bool(c.get('oddsAllowPortfolioCompletionBurst')); assert int(c.get('oddsQuotaAssumedRemainingWhenUnknown',-1)) == 0; assert int(c.get('rejectionDiagnosticsLimit',0)) >= 120"
          python -c "import pathlib; s=pathlib.Path('scripts/r15_intelligence.py').read_text(encoding='utf-8'); assert 'assumed = max(0, safe_int(config.get(\"oddsQuotaAssumedRemainingWhenUnknown\"), 0))' in s; assert 'assumed = max(1, safe_int(config.get(\"oddsFreeMonthlyCredits\"), 500))' not in s"
          python -c "import pathlib; s=pathlib.Path('scripts/r15_intelligence.py').read_text(encoding='utf-8'); a=pathlib.Path('assets/app.js').read_text(encoding='utf-8'); assert 'reasonRu' in s and 'historyDiagnostic' in s and 'forecast.reasonRu || row.reasonRu' in a; assert 'const hasForecast = !alreadyStarted && forecast.mode' in a and 'Предматчевый прогноз закрыт' in a; assert 'daily.length > 15' not in a"
          python -m py_compile \
            scripts/update_predictions.py \
            scripts/r15_free_mesh.py \
            scripts/r15_intelligence.py \
            scripts/r15_daily_auditor.py \
            scripts/update_live.py
          python -m json.tool config/analysis.json >/dev/null
          python -m json.tool data/state.json >/dev/null
          python -m json.tool data/football-history-cache.json >/dev/null
          python -m json.tool data/team-registry.json >/dev/null
          python -m json.tool data/free-data-mesh.json >/dev/null
          python -m json.tool data/clubelo-ratings.json >/dev/null
          python -m json.tool data/russian-team-names.json >/dev/null
          python -m json.tool data/provider-health.json >/dev/null
          python -m json.tool data/r15-runtime-control.json >/dev/null
          python -m json.tool data/cloudflare-ai-daily-audit.json >/dev/null
          node --check assets/app.js
          python scripts/r15_free_mesh.py --self-test
          python scripts/r15_daily_auditor.py --self-test
          python scripts/r15_intelligence.py --self-test
          python scripts/r15_rollover_gate.py --self-test
          python -c "import pathlib; s=pathlib.Path('.github/workflows/live-update.yml').read_text(encoding='utf-8'); assert 'if python scripts/r15_rollover_gate.py --should-defer; then' in s; assert 'python scripts/r15_intelligence.py --settle' in s and 'python scripts/r15_intelligence.py --validate' in s"
          python scripts/update_live.py --self-test
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/update-data.yml").read_text(encoding="utf-8")
          assert "pages: write" in workflow, "Pages build API requires least-privilege Pages write permission"
          assert "pages/builds" in workflow, "Production must explicitly request a Pages build after publishing data"
          assert "R3R8_PAGES_BUILD_REQUESTED=GREEN" in workflow, "Pages refresh must emit a verifiable success marker"
          print("R3R8_PAGES_REFRESH_REGRESSION=GREEN")
          PY

      - name: Refresh no-key historical intelligence first
        shell: bash
        run: |
          set -euo pipefail
          python scripts/r15_free_mesh.py --refresh
          python scripts/r15_intelligence.py --history-refresh

      - name: Refresh final scores without regenerating picks
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
        run: |
          set -euo pipefail
          python scripts/update_live.py --update
          python scripts/r15_intelligence.py --settle

      - name: Prepare or publish one complete Moscow day
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_BACKUP: ${{ secrets.ODDS_API_KEY_BACKUP }}
          R15_BOOTSTRAP_PREVIEW: ${{ inputs.bootstrap_preview }}
          R15_RECOVERY_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_today || false }}
          CLOUDFLARE_AI_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_AI_ACCESS_TOKEN }}
          CLOUDFLARE_AI_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          CLOUDFLARE_AI_URL: https://ai-football-free.shevtsov001.workers.dev/internal/ai
        run: |
          set -euo pipefail
          python scripts/r15_daily_auditor.py --status
          python scripts/r15_intelligence.py --generate
          python scripts/r15_intelligence.py --validate
          python scripts/update_live.py --validate

      - name: Commit one atomic public state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_ENGINE_BLOB="$(git rev-parse HEAD:scripts/r15_intelligence.py)"
          EXPECTED_CONFIG_BLOB="$(git rev-parse HEAD:config/analysis.json)"
          echo "R3R8_EXPECTED_ENGINE_BLOB=$EXPECTED_ENGINE_BLOB"
          echo "R3R8_EXPECTED_CONFIG_BLOB=$EXPECTED_CONFIG_BLOB"

          PUBLIC_STATE_FILES=(
            data/state.json
            data/ai_daily_analysis.json
            data/full-day-board.json
            data/last-update-report.json
            data/live-state.json
            data/live-learning.json
            data/football-history-cache.json
            data/team-registry.json
            data/free-data-mesh.json
            data/clubelo-ratings.json
            data/russian-team-names.json
            data/fonbet-public-snapshot.json
            data/thesportsdb-team-cache.json
            data/r15-odds-cache.json
            data/football-data-fixtures-odds.json
            data/provider-health.json
            data/r15-runtime-control.json
            data/cloudflare-ai-daily-audit.json
          )

          for path in "${PUBLIC_STATE_FILES[@]}"; do
            if [[ -e "$path" ]] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            else
              echo "R3R8_OPTIONAL_STATE_FILE_SKIPPED=$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "R15F_R3_NO_PUBLIC_DATA_CHANGES=YES"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R15F R3 publish cognitive portfolio [skip ci]"

          for attempt in 1 2 3; do
            echo "R3R8_PUSH_ATTEMPT=$attempt"
            git fetch origin main --prune

            REMOTE_ENGINE_BLOB="$(git rev-parse origin/main:scripts/r15_intelligence.py)"
            REMOTE_CONFIG_BLOB="$(git rev-parse origin/main:config/analysis.json)"
            if [[ "$REMOTE_ENGINE_BLOB" != "$EXPECTED_ENGINE_BLOB" || "$REMOTE_CONFIG_BLOB" != "$EXPECTED_CONFIG_BLOB" ]]; then
              echo "R3R8_SOURCE_DRIFT_ABORT=YES"
              echo "R3R8_REMOTE_ENGINE_BLOB=$REMOTE_ENGINE_BLOB"
              echo "R3R8_REMOTE_CONFIG_BLOB=$REMOTE_CONFIG_BLOB"
              exit 78
            fi

            git rebase origin/main

            HEAD_ENGINE_BLOB="$(git rev-parse HEAD:scripts/r15_intelligence.py)"
            HEAD_CONFIG_BLOB="$(git rev-parse HEAD:config/analysis.json)"
            if [[ "$HEAD_ENGINE_BLOB" != "$EXPECTED_ENGINE_BLOB" || "$HEAD_CONFIG_BLOB" != "$EXPECTED_CONFIG_BLOB" ]]; then
              echo "R3R8_REBASE_SOURCE_DRIFT_ABORT=YES"
              exit 79
            fi

            if git push origin HEAD:main; then
              echo "R3R8_PUBLIC_DATA_PUSH=GREEN"
              PAGES_BUILD_RESPONSE="$(curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/builds")"
              echo "$PAGES_BUILD_RESPONSE"
              python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("status") in {"queued","building","built"}, d' "$PAGES_BUILD_RESPONSE"
              echo "R3R8_PAGES_BUILD_REQUESTED=GREEN"
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          expected_state = json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          expected_daily = json.loads(Path("data/ai_daily_analysis.json").read_text(encoding="utf-8"))
          expected_meta = expected_state.get("meta") or {}
          expected_updated = expected_daily.get("updatedAt")
          expected_day = expected_daily.get("analysisDateLocal")
          if expected_meta.get("updatedAt") != expected_updated:
              raise SystemExit("LOCAL_STATE_SNAPSHOT_TIMESTAMP_MISMATCH")
          base = "https://r1a156.github.io/ai-football-lab/"
          def fetch_json(path, attempt):
              url = base + path + "?check=" + str(time.time_ns()) + "-" + str(attempt)
              request = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache", "User-Agent": "AI-Football-Pages-Publish-Check/1.0"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError("HTTP " + str(response.status) + " for " + path)
                  return json.load(response)
          last = "not checked"
          for attempt in range(10):
              try:
                  live_state = fetch_json("data/state.json", attempt)
                  live_daily = fetch_json("data/ai_daily_analysis.json", attempt)
                  live_meta = live_state.get("meta") or {}
                  if (live_meta.get("updatedAt") == expected_meta.get("updatedAt")
                      and live_meta.get("analysisDateLocal") == expected_day
                      and live_daily.get("updatedAt") == expected_updated
                      and live_daily.get("analysisDateLocal") == expected_day):
                      print("R3R8_PUBLIC_PAGES_STATE=GREEN")
                      print("R3R8_PUBLIC_PAGES_UPDATED_AT=" + str(expected_updated))
                      break
                  last = "published state/snapshot does not yet match the pushed commit"
              except Exception as error:
                  last = repr(error)
              time.sleep(10)
          else:
              raise SystemExit("R3R8_PUBLIC_PAGES_STATE=FAILED " + last)
          PY
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "R3R8_PUBLIC_DATA_PUSH=FAILED"
          exit 1
