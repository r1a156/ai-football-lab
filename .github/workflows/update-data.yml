name: Ежедневное обновление футбольной аналитики

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/update_predictions.py"
      - "config/analysis.json"
      - "assets/app.js"
      - ".github/workflows/update-data.yml"

  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: football-analysis-update
  cancel-in-progress: false

jobs:
  update:
    name: Четыре лучших матча на ближайшие 24 часа
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка секретов
        shell: bash
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${FOOTBALL_DATA_API_KEY}" ]; then
            echo "::error::Не задан секрет FOOTBALL_DATA_API_KEY"
            exit 1
          fi

          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY отсутствует. Будет использован статистический модуль."
          else
            echo "OpenRouter secret присутствует."
          fi

      - name: Статическая и офлайн-проверка
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py
          python -m json.tool config/analysis.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          python scripts/update_predictions.py --validate
          python scripts/update_predictions.py --self-test

      - name: Обновление данных
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          python scripts/update_predictions.py --update

      - name: Проверка результата V5
        run: |
          set -euo pipefail
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/last-update-report.json > /dev/null

          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          state = json.loads(
              Path("data/state.json").read_text(encoding="utf-8")
          )
          config = json.loads(
              Path("config/analysis.json").read_text(encoding="utf-8")
          )
          report = json.loads(
              Path("data/last-update-report.json").read_text(
                  encoding="utf-8"
              )
          )

          meta = state.get("meta", {})
          predictions = state.get("predictions", [])
          target = int(config.get("dailyPredictionCount") or 4)
          candidate_count = int(meta.get("candidateMatches") or 0)

          if meta.get("mode") != "real":
              raise SystemExit("state.json не находится в real-режиме")

          if report.get("status") == "FAILED":
              raise SystemExit("Pipeline сформировал FAILED-отчёт")

          if int(meta.get("selectedPredictions") or 0) != len(predictions):
              raise SystemExit(
                  "selectedPredictions не совпадает с predictions"
              )

          if len(predictions) > target:
              raise SystemExit(
                  f"Опубликовано больше дневной цели: {len(predictions)} > {target}"
              )

          if candidate_count >= target and len(predictions) != target:
              raise SystemExit(
                  f"При {candidate_count} кандидатах ожидалось {target} прогноза, "
                  f"получено {len(predictions)}"
              )

          match_ids = [
              int(item.get("sourceMatchId"))
              for item in predictions
          ]

          if len(match_ids) != len(set(match_ids)):
              raise SystemExit("В публичной выдаче есть дубли matchId")

          updated_at = dt.datetime.fromisoformat(
              str(meta.get("updatedAt")).replace("Z", "+00:00")
          )
          if updated_at.tzinfo is None:
              updated_at = updated_at.replace(tzinfo=dt.timezone.utc)

          lead_hours = float(config.get("minimumLeadHours") or 1)
          window_hours = float(config.get("selectionWindowHours") or 24)
          window_start = updated_at + dt.timedelta(hours=lead_hours)
          window_end = window_start + dt.timedelta(hours=window_hours)

          for item in predictions:
              kickoff = dt.datetime.fromisoformat(
                  str(item.get("utcDate")).replace("Z", "+00:00")
              )
              if kickoff.tzinfo is None:
                  kickoff = kickoff.replace(tzinfo=dt.timezone.utc)

              if not window_start <= kickoff <= window_end:
                  raise SystemExit(
                      f"Прогноз вне 24-часового окна: matchId={item.get('sourceMatchId')}"
                  )

              fair_odds = float(item.get("fairOdds") or 0)
              probability = float(item.get("probability") or 0)

              if fair_odds <= 1:
                  raise SystemExit(
                      f"Некорректный модельный коэффициент: {fair_odds}"
                  )

              if not 0 < probability < 1:
                  raise SystemExit(
                      f"Некорректная вероятность: {probability}"
                  )

          print("Режим:", meta.get("mode"))
          print("Статус:", meta.get("analysisStatus"))
          print("RADAR:", candidate_count)
          print("PRED:", len(predictions))
          print("TARGET:", target)
          print("WINDOW_HOURS:", window_hours)
          print("MODEL:", meta.get("analysisModel"))
          print("ODDS_SOURCE: MODEL_FAIR_NOT_BOOKMAKER")
          PY

      - name: Сохранение обновлённых данных
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/state.json data/last-update-report.json; then
            echo "Данные не изменились. Коммит не требуется."
            exit 0
          fi

          git config user.name "AI Football Lab Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/state.json data/last-update-report.json
          git commit -m "Ежедневные 4 прогноза на ближайшие 24 часа"
          git push origin main
