name: Ежедневное глобальное обновление футбольной аналитики

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/update_predictions.py"
      - "config/analysis.json"
      - "assets/app.js"
      - ".github/workflows/update-data.yml"

  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: football-analysis-update
  cancel-in-progress: false

jobs:
  update:
    name: Четыре лучших прогноза из глобального пула лиг
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка секретов
        shell: bash
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${FOOTBALL_DATA_API_KEY}" || { echo "::error::Не задан FOOTBALL_DATA_API_KEY"; exit 1; }
          test -n "${ODDS_API_KEY}" || { echo "::error::Не задан ODDS_API_KEY"; exit 1; }
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY отсутствует; будет использована статистика и глобальный рыночный консенсус."
          fi

      - name: Статическая и офлайн-проверка V9
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py
          python -m json.tool config/analysis.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          python scripts/update_predictions.py --validate
          python scripts/update_predictions.py --self-test

      - name: Глобальный поиск и обновление
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/update_predictions.py --update

      - name: Проверка результата V9 Global Discovery
        run: |
          set -euo pipefail
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/last-update-report.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          config = json.loads(Path("config/analysis.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/last-update-report.json").read_text(encoding="utf-8"))
          meta = state.get("meta", {})
          predictions = state.get("predictions", [])
          target = int(config.get("dailyPredictionCount") or 4)

          if report.get("status") != "GREEN":
              raise SystemExit("Pipeline не сформировал GREEN-отчёт")
          if not meta.get("globalDiscoveryEnabled"):
              raise SystemExit("Глобальное обнаружение не включено")
          if meta.get("globalDiscoverySource") != "THE_ODDS_API_EVENTS":
              raise SystemExit("Использован неверный источник глобального календаря")
          if int(meta.get("globalSportsScanned") or 0) <= 0:
              raise SystemExit("Не просканированы активные футбольные лиги")
          if int(meta.get("globalLeaguesWithEvents") or 0) <= 0:
              raise SystemExit("Глобальный поиск не нашёл лиги с матчами")
          if int(meta.get("globalEventsDiscovered") or 0) <= 0:
              raise SystemExit("Глобальный поиск не нашёл матчи")
          if len(predictions) != target:
              raise SystemExit(f"Прогнозов {len(predictions)}, ожидалось {target}")
          if int(meta.get("selectedPredictions") or 0) != target:
              raise SystemExit("selectedPredictions не равен четырём")

          ids = [int(item["sourceMatchId"]) for item in predictions]
          if len(ids) != len(set(ids)):
              raise SystemExit("Обнаружены дубли матчей")
          leagues = {str(item.get("league") or "") for item in predictions}
          countries = {str(item.get("country") or "") for item in predictions}
          if len(leagues) != 4:
              raise SystemExit(f"Подборка не охватывает четыре лиги: {sorted(leagues)}")
          minimum_countries = int(config.get("minimumPublishedCountries") or 3)
          if len(countries) < minimum_countries:
              raise SystemExit(f"Недостаточно стран: {sorted(countries)}")

          market_counts = {}
          for item in predictions:
              market = str(item.get("market") or "")
              market_counts[market] = market_counts.get(market, 0) + 1
              odds = float(item.get("bookmakerOdds") or 0)
              probability = float(item.get("probability") or 0)
              ev = float(item.get("expectedValue") or -1)
              if market not in {"HOME_WIN", "DRAW", "AWAY_WIN"}:
                  raise SystemExit(f"Неподдерживаемый рынок: {market}")
              if odds < float(config.get("minimumBookmakerOdds") or 1.45):
                  raise SystemExit(f"Слишком низкий коэффициент: {odds}")
              if probability < float(config.get("minimumPublishedProbability") or 0.50):
                  raise SystemExit(f"Слишком низкая вероятность: {probability}")
              if ev < float(config.get("fallbackMinimumExpectedValue") or 0.0):
                  raise SystemExit(f"Отрицательный EV: {ev}")
              if item.get("coefficientType") != "BOOKMAKER_MARKET":
                  raise SystemExit("Используется не букмекерский коэффициент")
              if not str(item.get("bookmaker") or "").strip():
                  raise SystemExit("Не указан букмекер")
              if float(item.get("stakePercent") or 0) != 20:
                  raise SystemExit("Прогноз не получил ставку 20% банка")
              if float(item.get("stake") or 0) <= 0:
                  raise SystemExit("У прогноза отсутствует виртуальная ставка")
              age = item.get("oddsAgeMinutes")
              if age is None or float(age) > 30:
                  raise SystemExit(f"Коэффициент устарел: {age}")
              if not str(item.get("oddsEventId") or ""):
                  raise SystemExit("Не сохранён oddsEventId")
              if not str(item.get("oddsSportKey") or ""):
                  raise SystemExit("Не сохранён oddsSportKey")

          if max(market_counts.values()) > 2:
              raise SystemExit(f"Один рынок занял больше двух мест: {market_counts}")
          if meta.get("virtualBankOddsType") != "BOOKMAKER_FIXED_AT_PUBLICATION":
              raise SystemExit("Банк использует неверный тип коэффициента")

          print("GLOBAL_SPORTS_SCANNED:", meta.get("globalSportsScanned"))
          print("GLOBAL_LEAGUES_WITH_EVENTS:", meta.get("globalLeaguesWithEvents"))
          print("GLOBAL_EVENTS_DISCOVERED:", meta.get("globalEventsDiscovered"))
          print("ODDS_SPORT_KEYS:", meta.get("oddsSportKeys"))
          print("COUNTRIES:", sorted(countries))
          print("LEAGUES:", sorted(leagues))
          print("PRED:", len(predictions))
          print("BANK_ODDS_TYPE:", meta.get("virtualBankOddsType"))
          PY

      - name: Сохранение обновлённых данных
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/state.json data/last-update-report.json; then
            echo "Данные не изменились. Коммит не требуется."
            exit 0
          fi
          git config user.name "AI Football Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/last-update-report.json
          git commit -m "V9 update global football predictions"
          git pull --rebase origin main
          git push origin main
