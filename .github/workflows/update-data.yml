name: Ежедневное обновление футбольной аналитики

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/update_predictions.py"
      - "config/analysis.json"
      - "assets/app.js"
      - ".github/workflows/update-data.yml"

  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: football-analysis-update
  cancel-in-progress: false

jobs:
  update:
    name: Четыре прогноза со свежими проверенными коэффициентами
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка секретов
        shell: bash
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${FOOTBALL_DATA_API_KEY}" || { echo "::error::Не задан FOOTBALL_DATA_API_KEY"; exit 1; }
          test -n "${ODDS_API_KEY}" || { echo "::error::Не задан ODDS_API_KEY"; exit 1; }
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY отсутствует; будет использован статистический модуль."
          fi

      - name: Статическая и офлайн-проверка
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py
          python -m json.tool config/analysis.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          python scripts/update_predictions.py --validate
          python scripts/update_predictions.py --self-test

      - name: Обновление данных и коэффициентов
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/update_predictions.py --update

      - name: Проверка результата V8
        run: |
          set -euo pipefail
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/last-update-report.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          config = json.loads(Path("config/analysis.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/last-update-report.json").read_text(encoding="utf-8"))
          meta = state.get("meta", {})
          predictions = state.get("predictions", [])
          target = int(config.get("dailyPredictionCount") or 4)
          if report.get("status") == "FAILED":
              raise SystemExit("Pipeline сформировал FAILED-отчёт")
          if len(predictions) != target:
              raise SystemExit(f"Прогнозов {len(predictions)}, ожидалось {target}")
          if int(meta.get("selectedPredictions") or 0) != len(predictions):
              raise SystemExit("selectedPredictions не совпадает с predictions")
          ids = [int(item["sourceMatchId"]) for item in predictions]
          if len(ids) != len(set(ids)):
              raise SystemExit("Обнаружены дубли matchId")
          minimum_odds = float(config.get("minimumBookmakerOdds") or 1.45)
          minimum_ev = float(config.get("fallbackMinimumExpectedValue") or 0.0)
          for item in predictions:
              odds = float(item.get("bookmakerOdds") or 0)
              ev = float(item.get("expectedValue") or -1)
              if odds < minimum_odds:
                  raise SystemExit(f"bookmakerOdds ниже {minimum_odds}: {odds}")
              if ev < minimum_ev:
                  raise SystemExit(f"Отрицательный EV: {ev}")
              if item.get("coefficientType") != "BOOKMAKER_MARKET":
                  raise SystemExit("Используется не букмекерский коэффициент")
              if not str(item.get("bookmaker") or "").strip():
                  raise SystemExit("Не указан букмекер")
              if not str(item.get("oddsCapturedAt") or "").strip():
                  raise SystemExit("Не зафиксировано время коэффициента")
          if float(config.get("selectionWindowHours") or 0) != 24:
              raise SystemExit("Окно отбора не равно 24 часам")
          if int(config.get("maximumOddsAgeMinutes") or 0) > 30:
              raise SystemExit("Разрешены слишком старые коэффициенты")
          if int(config.get("maximumTotalStakePercent") or 0) != 20:
              raise SystemExit("Лимит виртуального банка должен быть 20%")
          for item in predictions:
              age = item.get("oddsAgeMinutes")
              if age is None or float(age) > 30:
                  raise SystemExit(f"Коэффициент устарел или не имеет времени: {age}")
              if float(item.get("oddsMatchScore") or 0) < 0.78:
                  raise SystemExit("Недостаточная надёжность сопоставления матча")
              kickoff_difference = item.get("oddsKickoffDifferenceMinutes")
              if kickoff_difference is None:
                  raise SystemExit(
                      "Не указано расхождение времени матча"
                  )
              try:
                  kickoff_difference_value = float(kickoff_difference)
              except (TypeError, ValueError):
                  raise SystemExit(
                      "Некорректное расхождение времени матча: "
                      f"{kickoff_difference}"
                  )
              if (
                  kickoff_difference_value < 0
                  or kickoff_difference_value > 60
              ):
                  raise SystemExit(
                      "Слишком большое расхождение времени матча: "
                      f"{kickoff_difference_value}"
                  )
          if meta.get("virtualBankOddsType") != "BOOKMAKER_FIXED_AT_PUBLICATION":
              raise SystemExit("Виртуальный банк настроен не на bookmakerOdds")
          print("MODE:", meta.get("mode"))
          print("PRED:", len(predictions))
          print("ODDS_EVENTS:", meta.get("oddsEvents"))
          print("ODDS_QUOTA:", meta.get("oddsQuota"))
          print("BANK_ODDS_TYPE:", meta.get("virtualBankOddsType"))
          PY

      - name: Сохранение обновлённых данных
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/state.json data/last-update-report.json; then
            echo "Данные не изменились. Коммит не требуется."
            exit 0
          fi
          git config user.name "AI Football Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/last-update-report.json
          git commit -m "V8 update fresh bookmaker odds and virtual bank"
          git push origin main
