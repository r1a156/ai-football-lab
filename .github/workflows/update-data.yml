# V10_AUTO_REFRESH_PIPELINE
name: V10 Global Sports Intelligence R3 Exact Four

on:
  workflow_dispatch:
    inputs:
      force_generation:
        description: "Сформировать новый список 15 прогнозов независимо от даты"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 */3 * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/update_predictions.py"
      - "config/analysis.json"
      - "index.html"
      - "assets/app.js"
      - "assets/styles.css"
      - ".github/workflows/update-data.yml"
      - "README.md"
      - "data/force-generation-request.json"

permissions:
  contents: write

concurrency:
  group: v10-global-sports-intelligence
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  validate:
    name: V10 static and offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_predictions.py
          python -m json.tool config/analysis.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          python scripts/update_predictions.py --validate
          python scripts/update_predictions.py --self-test

      - name: Validate browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/app.js

  update:
    name: Refresh events, results, analysis and bank
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[v10-force-generation]')
      )
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required and optional data sources
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${ODDS_API_KEY}" || {
            echo "::error::ODDS_API_KEY is required for V10 production refresh"
            exit 1
          }
          if [ -z "${FOOTBALL_DATA_API_KEY}" ]; then
            echo "::warning::FOOTBALL_DATA_API_KEY is missing; football events outside supported competitions will use the MARKET data tier."
          fi
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY is missing; deterministic explanations will be used."
          fi

      - name: Migrate legacy state when required
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/state.json")
          state = json.loads(path.read_text(encoding="utf-8-sig"))
          meta = state.get("meta") if isinstance(state.get("meta"), dict) else {}
          needs_migration = (
              meta.get("version") != "10.0.0"
              or meta.get("sourceMarker") != "V10_GLOBAL_MULTISPORT_INTELLIGENCE"
              or not isinstance(state.get("dailyAnalysis"), list)
              or not isinstance(state.get("bestBets"), list)
          )
          print(f"STATE_MIGRATION_REQUIRED={str(needs_migration).upper()}")
          Path(".v10-migration-required").write_text(
              "YES" if needs_migration else "NO",
              encoding="ascii",
          )
          PY
          if [ "$(cat .v10-migration-required)" = "YES" ]; then
            python scripts/update_predictions.py --migrate-state
          fi
          rm -f .v10-migration-required

      - name: Run V10 refresh
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          V10_EVENT_NAME: ${{ github.event_name }}
          V10_FORCE_INPUT: ${{ inputs.force_generation || 'false' }}
          V10_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          force_generation="false"

          if [ "${V10_EVENT_NAME}" = "workflow_dispatch" ] && [ "${V10_FORCE_INPUT}" = "true" ]; then
            force_generation="true"
          fi

          if [ "${V10_EVENT_NAME}" = "push" ] && [[ "${V10_HEAD_COMMIT_MESSAGE}" == *"[v10-force-generation]"* ]]; then
            force_generation="true"
          fi

          echo "V10_EVENT_NAME=${V10_EVENT_NAME}"
          echo "V10_FORCE_GENERATION=${force_generation}"

          if [ "${force_generation}" = "true" ]; then
            python scripts/update_predictions.py --update
          else
            python scripts/update_predictions.py --auto
          fi

      - name: Validate published V10 state
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/state.json > /dev/null
          python -m json.tool data/last-update-report.json > /dev/null
          python -m json.tool data/ai_daily_analysis.json > /dev/null
          python scripts/update_predictions.py --validate
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/last-update-report.json").read_text(encoding="utf-8"))
          config = json.loads(Path("config/analysis.json").read_text(encoding="utf-8"))

          meta = state.get("meta") or {}
          daily = state.get("dailyAnalysis") or []
          best = state.get("bestBets") or []
          bank = state.get("bank") or {}

          if meta.get("version") != "10.0.0":
              raise SystemExit("State version is not 10.0.0")
          if meta.get("cleanStart") and meta.get("resetMarker") != "V10_CLEAN_MODEL_RESET":
              raise SystemExit("Clean-start state is missing reset marker")
          if meta.get("sourceMarker") != "V10_GLOBAL_MULTISPORT_INTELLIGENCE":
              raise SystemExit("V10 source marker is missing")
          if report.get("status") not in {"GREEN", "DEGRADED"}:
              raise SystemExit(f"Pipeline report is not publishable: {report.get('status')}")
          if len(daily) > int(config["dailyAnalysisTarget"]):
              raise SystemExit("More than 15 daily analyses were published")
          if len(best) > int(config["bestBetsTarget"]):
              raise SystemExit("More than 4 best bets were published")
          if len(daily) == int(config["dailyAnalysisTarget"]) and len(best) != int(config["bestBetsTarget"]):
              raise SystemExit("Fifteen analyses must publish exactly four best bets")
          if meta.get("status") == "GREEN" and len(daily) != int(config["dailyAnalysisTarget"]):
              raise SystemExit("GREEN state must contain exactly 15 analyses")

          daily_events = [str(item.get("eventId") or "") for item in daily]
          if any(not value for value in daily_events):
              raise SystemExit("A daily analysis has no eventId")
          if len(daily_events) != len(set(daily_events)):
              raise SystemExit("Duplicate events exist in dailyAnalysis")

          best_events = [str(item.get("eventId") or "") for item in best]
          if any(not value for value in best_events):
              raise SystemExit("A best bet has no eventId")
          if len(best_events) != len(set(best_events)):
              raise SystemExit("Duplicate events exist in bestBets")

          for item in daily:
              if float(item.get("bookmakerOdds") or item.get("odds") or 0) <= 1:
                  raise SystemExit("Daily analysis does not contain real bookmaker odds")
              if not str(item.get("bookmaker") or "").strip():
                  raise SystemExit("Daily analysis does not contain bookmaker name")
              if not item.get("isBestBet") and float(item.get("stake") or 0) != 0:
                  raise SystemExit("A non-best analysis affects the virtual bank")

          for item in best:
              if float(item.get("stakePercent") or 0) != 20:
                  raise SystemExit("Every best bet must use 20 percent stake")
              if float(item.get("stake") or 0) <= 0:
                  raise SystemExit("A best bet has no fixed virtual stake")
              if float(item.get("bookmakerOdds") or item.get("odds") or 0) <= 1:
                  raise SystemExit("A best bet does not contain real bookmaker odds")
              if item.get("settlementOddsType") != "BOOKMAKER_FIXED_AT_PUBLICATION":
                  raise SystemExit("A best bet has the wrong settlement odds policy")

          expected_exposure = sum(
              float(item.get("stake") or 0)
              for item in best
              if str(item.get("status") or "pending") == "pending"
          )
          if abs(float(bank.get("activeExposure") or 0) - expected_exposure) > 0.02:
              raise SystemExit("Virtual bank exposure does not match pending best bets")

          print("V10_STATE_VALIDATION=GREEN")
          print("RESET_MARKER=", meta.get("resetMarker"))
          print("MODEL_EPOCH=", meta.get("modelEpoch"))
          print("STATE_STATUS=", meta.get("status"))
          print("DAILY_ANALYSIS=", len(daily))
          print("BEST_BETS=", len(best))
          print("SOCCER=", sum(item.get("sport") == "soccer" for item in daily))
          print("HOCKEY=", sum(item.get("sport") == "ice_hockey" for item in daily))
          print("BANK=", bank.get("current"))
          print("ACTIVE_EXPOSURE=", bank.get("activeExposure"))
          print("ODDS_QUOTA=", state.get("quota"))
          PY

      - name: Commit refreshed public data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/state.json \
            data/last-update-report.json \
            data/ai_daily_analysis.json

          if git diff --cached --quiet; then
            echo "No public data changes to commit."
            exit 0
          fi

          git commit -m "V10 refresh sports analysis, results and virtual bank"
          git pull --rebase origin main
          git push origin HEAD:main
