name: Deploy Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "CLOUDFLARE_API_TOKEN secret is missing"
            exit 2
          }

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cloudflare_pages_build.sh
          python - <<'PY'
          import json, pathlib
          state = json.loads(pathlib.Path("dist/data/state.json").read_text(encoding="utf-8"))
          daily = state.get("dailyAnalysis") or []
          expresses = state.get("expresses") or []
          assert 1 <= len(daily) <= 15, f"dailyAnalysis={len(daily)}"
          assert len(expresses) == min(3, len(daily)//5), (len(daily), len(expresses))
          print("STATIC_STATE_GREEN", len(daily), len(expresses))
          PY

      - name: Deploy Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy dist \
            --project-name ai-football-lab \
            --branch main \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-dirty=true

      - name: Verify canonical production
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          base = "https://ai-football-lab.pages.dev"
          last = None
          for attempt in range(8):
              try:
                  stamp = str(time.time_ns())
                  req = urllib.request.Request(
                      f"{base}/data/state.json?v={stamp}",
                      headers={"Cache-Control":"no-cache","User-Agent":"AI-Football-Deploy-Guard/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      state = json.load(r)
                  req = urllib.request.Request(
                      f"{base}/?v={stamp}",
                      headers={"Cache-Control":"no-cache","User-Agent":"AI-Football-Deploy-Guard/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      index = r.read().decode("utf-8", "replace")
                  daily = state.get("dailyAnalysis") or []
                  expresses = state.get("expresses") or []
                  if (
                      1 <= len(daily) <= 15
                      and len(expresses) == min(3, len(daily)//5)
                      and "15.7.1-pages-local-first" in index
                  ):
                      print("CLOUDFLARE_PUBLIC_VERIFY=GREEN")
                      print("PUBLIC_ANALYSIS=", len(daily))
                      print("PUBLIC_EXPRESSES=", len(expresses))
                      raise SystemExit(0)
                  last = f"analysis={len(daily)} expresses={len(expresses)} loader={'15.7.1-pages-local-first' in index}"
              except Exception as exc:
                  last = repr(exc)
              time.sleep(4)
          raise SystemExit("Cloudflare canonical verification failed: " + str(last))
          PY
